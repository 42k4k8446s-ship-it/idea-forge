<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idea Forge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">IDEA FORGE</p>
      <h1>把靈感留下來。</h1>
      <p class="subtitle">
        Game、Design、Video、Business，想到什麼就先丟進來。
      </p>
    </header>

    <section class="composer">
      <input id="ideaInput" type="text" placeholder="輸入一個新點子..." />

      <select id="categoryInput">
        <option value="Game">Game</option>
        <option value="Design">Design</option>
        <option value="Video">Video</option>
        <option value="Business">Business</option>
        <option value="Random">Random</option>
      </select>

      <button id="addBtn">新增 Idea</button>
      <button id="randomBtn" class="secondary">隨機抽一個</button>
    </section>

    <section id="randomResult" class="random-result hidden"></section>

    <section class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Game">Game</button>
        <button class="filter-btn" data-category="Design">Design</button>
        <button class="filter-btn" data-category="Video">Video</button>
        <button class="filter-btn" data-category="Business">Business</button>
        <button class="filter-btn" data-category="Random">Random</button>
      </div>

      <div class="toolbar-actions">
        <label class="favorite-toggle">
          <input id="favoriteOnly" type="checkbox" />
          只看想做
        </label>

        <button id="clearAllBtn" class="danger-btn">
          清空全部
        </button>
      </div>
    </section>

    <section>
      <div class="section-title">
        <div>
          <h2>Ideas</h2>
          <p id="filterStatus" class="filter-status">顯示全部</p>
        </div>

        <span id="ideaCount">0</span>
      </div>

      <div id="ideaList" class="idea-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
